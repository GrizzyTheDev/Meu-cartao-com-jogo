<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Perfil Profissional</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>

    <div class="cartao">
        <img src="https://avatars.githubusercontent.com/u/98723420?v=4" alt="Foto de Perfil" class="foto">
        <h1>Eric Hudson</h1>
        <p>Futuro Desenvolvedor Front-End</p>

        <div class="botoes-redes">
    <a href="https://github.com/seu-usuario" target="_blank" class="link">
        <i class="fa-brands fa-github"></i> Meu GitHub
    </a>
    
    <a href="https://www.linkedin.com/in/seu-nome" target="_blank" class="link">
        <i class="fa-brands fa-linkedin"></i> Meu LinkedIn
    </a>

    </div>
    </div>

    <div class="cartao-jogo">
        <p>Tédio? Jogue a Cobrinha! 🐍</p>
        <canvas id="snakeGame" width="300" height="300"></canvas>
        <p id="placar">Pontos: 0</p>
    </div>
</div>

<script>
const canvas = document.getElementById("snakeGame");
const ctx = canvas.getContext("2d");
const placarElemento = document.getElementById("placar");

const box = 20, tamanhoGrade = 15;
let pontos = 0, direcao = "", jogoRodando = false, tomDeCor = 0;
let cobra = [{ x: 7, y: 7 }];
let comida = { x: Math.floor(Math.random() * tamanhoGrade), y: Math.floor(Math.random() * tamanhoGrade) };

document.addEventListener("keydown", (e) => {
    const teclas = { ArrowUp: "UP", ArrowDown: "DOWN", ArrowLeft: "LEFT", ArrowRight: "RIGHT" };
    if (teclas[e.key]) {
        if (e.key === "ArrowUp" && direcao === "DOWN") return;
        if (e.key === "ArrowDown" && direcao === "UP") return;
        if (e.key === "ArrowLeft" && direcao === "RIGHT") return;
        if (e.key === "ArrowRight" && direcao === "LEFT") return;
        direcao = teclas[e.key];
        jogoRodando = true;
    }
});

function desenhar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Atualiza a cor (Ciclo de 0 a 360)
    tomDeCor = (tomDeCor + 2) % 360; 

    // 2. Desenha a Cobra com a cor dinâmica
    cobra.forEach((p, i) => {
        // HSL: tomDeCor, 70% de saturação, 50% de brilho
        ctx.fillStyle = `hsl(${tomDeCor}, 70%, 50%)`;
        ctx.fillRect(p.x * box, p.y * box, box - 2, box - 2);
    });

    // Desenha a Comida
    ctx.fillStyle = "#ff3e3e";
    ctx.fillRect(comida.x * box, comida.y * box, box - 2, box - 2);

    if (!jogoRodando) return;

    let nx = (cobra[0].x + (direcao === "LEFT" ? -1 : direcao === "RIGHT" ? 1 : 0) + tamanhoGrade) % tamanhoGrade;
    let ny = (cobra[0].y + (direcao === "UP" ? -1 : direcao === "DOWN" ? 1 : 0) + tamanhoGrade) % tamanhoGrade;

    if (cobra.some(p => p.x === nx && p.y === ny)) {
        alert("Game Over! Pontos: " + pontos);
        return reiniciarJogo();
    }

    cobra.unshift({ x: nx, y: ny });

    if (nx === comida.x && ny === comida.y) {
        pontos += 10;
        placarElemento.innerText = `Pontos: ${pontos}`;
        comida = { x: Math.floor(Math.random() * tamanhoGrade), y: Math.floor(Math.random() * tamanhoGrade) };
    } else {
        cobra.pop();
    }
}

function reiniciarJogo() {
    pontos = 0; placarElemento.innerText = "Pontos: 0";
    cobra = [{ x: 7, y: 7 }]; direcao = ""; jogoRodando = false;
}

setInterval(desenhar, 150);
</script>

</body>
</html>
